<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#2D2A26"/>
  <!-- Aperture blades - 6 overlapping curved iris blades -->
  <g opacity="0.3">
    <!-- Each blade is a curved shape from outer ring toward center -->
    <path d="M16 4 Q22 7 20.5 11 L15 9 Q14 5 16 4Z" fill="#C4A484"/>
    <path d="M26 9 Q25 16 21.5 15 L19.5 10 Q23 7 26 9Z" fill="#C4A484"/>
    <path d="M26 21 Q21 24 19 20 L22 16 Q26 16 26 21Z" fill="#C4A484"/>
    <path d="M16 28 Q10 25 11.5 21 L17 23 Q18 27 16 28Z" fill="#C4A484"/>
    <path d="M6 23 Q7 16 10.5 17 L12.5 22 Q9 25 6 23Z" fill="#C4A484"/>
    <path d="M6 11 Q11 8 13 12 L10 16 Q6 16 6 11Z" fill="#C4A484"/>
  </g>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#C4A484" stroke-width="0.6" opacity="0.35"/>
  <!-- Inner aperture opening -->
  <circle cx="16" cy="16" r="7" fill="#2D2A26"/>
  <!-- Subtle inner ring -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="#C4A484" stroke-width="0.5" opacity="0.45"/>
  <!-- RM monogram -->
  <text x="16" y="19.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="9.5" font-weight="bold" fill="#C4A484">RM</text>
</svg>
